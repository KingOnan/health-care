repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ["--config-file=backend/pyproject.toml"]
        additional_dependencies: [fastapi, pydantic, pydantic-settings, sqlalchemy, alembic, types-passlib, PyJWT]
